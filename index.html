<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#10233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>City Mahjong</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>

    padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); box-sizing: border-box; overflow: hidden; }

</head>
<body>
<div id="stage"><canvas id="c" width="360" height="640" aria-label="City Mahjong"></canvas></div>

<div class="sheet" id="homeSheet">
  <div class="card" style="text-align:center">
    <div style="font-family:var(--font-display);font-size:13px;letter-spacing:2px;color:#8a8f99">DAILY TILE PUZZLE</div>
    <h2 style="font-size:40px;margin:4px 0 2px">City Mahjong</h2>
    <p id="homeDay">Same board for everyone today.</p>
    <div class="tabs" role="tablist" aria-label="Layout" style="margin-top:6px">
      <button type="button" role="tab" id="homeTurtle" aria-selected="true">TURTLE</button>
      <button type="button" role="tab" id="homeTowers" aria-selected="false">TOWERS</button>
    </div>
    <button class="btn" type="button" id="homePlay">PLAY</button>
    <button class="btn quiet" type="button" id="homeBoard">Leaderboard</button>
    <button class="btn quiet" type="button" id="homeName">Playing as: <span id="homeWho">?</span></button>
    <p class="sub" style="margin:12px 0 0">Tap a free tile to bank it, tap its match to clear both. Four in the bank with no match and you're out.</p>
  </div>
</div>

<div class="sheet" id="nameSheet" hidden>
  <form class="card" id="nameForm">

    <label for="nameInput" style="position:absolute;left:-9999px">Name</label>

    <button class="btn" type="submit">Let's go</button>
  </form>
</div>

<div class="sheet" id="boardSheet" hidden>
  <div class="card">
    <h2>Leaderboard</h2>
    <p id="boardSub">Today · Turtle</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-scope="today">TODAY</button>
      <button type="button" role="tab" aria-selected="false" data-scope="week">THIS WEEK</button>
      <button type="button" role="tab" aria-selected="false" data-scope="all">ALL TIME</button>
    </div>
    <div id="boardBody"><div class="empty">Loading…</div></div>
    <button class="btn quiet" type="button" id="boardClose">Back to the game</button>

</div>

<div class="sheet" id="winSheet" hidden>
  <div class="card" style="text-align:center">
    <h2 id="winTitle">Cleared!</h2>

    <button class="btn quiet" type="button" id="winHome">Home</button>
  </div>
</div>

    if (sy > BANK_Y - 6 && sy < BANK_Y + BTH + 6) return;
    let hit = null;
    for (const i of [...S.alive].sort((a, b) => POS[b].z - POS[a].z || POS[b].y - POS[a].y)) { const [x, y] = tileXY(i); if (sx >= x && sx <= x + TW && sy >= y && sy <= y + TH) { hit = i; break; } }
    if (hit !== null) pick(hit);
  });
  function tileXY(i) { const p = POS[i]; return [OX + p.x * UX + p.z * ZX, OY + p.y * UY + p.z * ZY]; }

  // --- Drawing ---
  function rr(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
  function face(k) {
    const cx = 20;
    if (k.suit === 'face') {
      const im = faceImgs[k.n];
      ctx.save(); ctx.beginPath(); ctx.roundRect(3, 3, 34, 48, 4); ctx.clip();
      if (im.complete && im.naturalWidth) { const s = Math.max(34 / im.naturalWidth, 48 / im.naturalHeight); const w = im.naturalWidth * s, h = im.naturalHeight * s; ctx.drawImage(im, 3 + (34 - w) / 2, 3 + (48 - h) / 2, w, h); }
      else { ctx.fillStyle = '#d9d2c3'; ctx.fillRect(3, 3, 34, 48); ctx.fillStyle = '#8a7352'; ctx.font = `20px ${FD}`; ctx.textAlign = 'center'; ctx.fillText('?', 20, 34); }
      ctx.restore(); return;
    }
    const color = k.suit === 'bus' ? '#d12b2b' : k.suit === 'cab' ? '#1f232c' : '#2f8f4e';
    ctx.fillStyle = color; ctx.font = `24px ${FD}`; ctx.textAlign = 'center'; ctx.fillText(k.n, cx, 25);
    const marks = Math.min(3, k.n);
    for (let m = 0; m < marks; m++) { const gx = cx - (marks - 1) * 5.5 + m * 11;
      if (k.suit === 'bus') rr(gx - 4, 31, 8, 10, 2, color);
      else if (k.suit === 'cab') rr(gx - 4.5, 33, 9, 6, 2.5, color);
      else { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(gx, 36, 4, 0, 7); ctx.fill(); } }
    ctx.fillStyle = '#8a8f99'; ctx.font = `800 7px ${FB}`; ctx.fillText(k.suit.toUpperCase(), cx, 49);
  }
  function tileBody(x, y, i, hint, free, lift, w, h, zx, zy) {
    const s = w / 40;
    if (lift) { rr(x - zx + 1, y - zy + 1, w, h, 5 * s, C.edge); rr(x - 2 * s, y + 2 * s, w, h, 5 * s, C.side); }
    rr(x, y, w, h, 5 * s, hint ? '#c8f0d4' : C.tile);
    ctx.strokeStyle = C.edge; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 5 * s); ctx.stroke();
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); face(KINDS[S.kinds[i]]); ctx.restore();
    if (!free) { ctx.fillStyle = 'rgba(40,60,50,.3)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 5 * s); ctx.fill(); }
  }
  function drawTile(i) { const [x, y] = tileXY(i); tileBody(x, y, i, S.hint && S.hint.includes(i) && S.hintT > 0, isFree(i), true, TW, TH, ZX, ZY); }
  const bankX = slot => (W - (BANK * BTW + (BANK - 1) * 12)) / 2 + slot * (BTW + 12);
  function drawBank() {
    rr(bankX(0) - 14, BANK_Y - 14, BANK * BTW + (BANK - 1) * 12 + 28, BTH + 28, 16, 'rgba(22,26,36,.55)');
    ctx.fillStyle = '#9fb3cc'; ctx.font = `800 8px ${FB}`; ctx.textAlign = 'left'; ctx.fillText('BANK · 4 = OUT', bankX(0) - 8, BANK_Y - 3);
    for (let s = 0; s < BANK; s++) {
      const x = bankX(s);
      if (S.bank[s] === undefined) { ctx.strokeStyle = 'rgba(255,248,234,.3)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, BANK_Y, BTW, BTH, 5); ctx.stroke(); ctx.setLineDash([]); }
      else tileBody(x, BANK_Y, S.bank[s], S.hint && S.hint.includes(S.bank[s]) && S.hintT > 0, true, false, BTW, BTH, 0, 0);
    }
  }
  function render() {
    ctx.fillStyle = C.felt; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.feltDark; for (let y = 0; y < H; y += 24) for (let x = (y / 24 % 2) * 12; x < W; x += 24) ctx.fillRect(x, y, 2, 2);
    const order = [...S.alive].sort((a, b) => POS[a].z - POS[b].z || POS[a].y - POS[b].y || POS[b].x - POS[a].x);
    for (const i of order) drawTile(i);
    drawBank();
    rr(10, 12, W - 20, 56, 16, 'rgba(22,26,36,.9)');
    ctx.textAlign = 'left'; ctx.fillStyle = C.cash; ctx.font = `28px ${FD}`; ctx.fillText(S.score, 26, 51);
    ctx.textAlign = 'center'; ctx.fillStyle = '#9fb3cc'; ctx.font = `800 10px ${FB}`; ctx.fillText('CITY MAHJONG · DAILY ' + DAY.slice(8) + '/' + DAY.slice(5, 7), W / 2 + 6, 34);
    ctx.fillStyle = C.paper; ctx.font = `800 12px ${FB}`; ctx.fillText(S.alive.size + ' tiles left', W / 2 + 6, 54);
    ctx.textAlign = 'right'; ctx.fillStyle = C.paper; ctx.font = `22px ${FD}`; ctx.fillText(Math.floor(S.t) + 's', W - 26, 50);
    CHIPS.forEach((c, k) => { const x = 12 + k * chipW; const on = false; const label = c === 'Hint' ? 'HINT −5' : c === 'Shuffle' ? 'SHUFFLE −20' : c.toUpperCase(); rr(x + 2, 74, chipW - 4, 24, 8, on ? C.sel : 'rgba(22,26,36,.6)'); ctx.textAlign = 'center'; ctx.fillStyle = on ? C.ink : C.paper; ctx.font = `800 9px ${FB}`; ctx.fillText(label, x + chipW / 2, 90); });
    if (S.toastT > 0) { ctx.globalAlpha = Math.min(1, S.toastT * 3); ctx.fillStyle = S.toast.color; ctx.font = `26px ${FD}`; ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.textAlign = 'center'; ctx.strokeText(S.toast.text, W / 2, 130 - (0.9 - S.toastT) * 20); ctx.fillText(S.toast.text, W / 2, 130 - (0.9 - S.toastT) * 20); ctx.globalAlpha = 1; }
  }
  let last = performance.now();
  function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; if (S.running) S.t += dt; if (S.toastT > 0) S.toastT -= dt; if (S.hintT > 0) S.hintT -= dt; render(); requestAnimationFrame(frame); }
  reset(); requestAnimationFrame(frame); syncHome();
  // Re-deal once the uploaded faces arrive, as long as nobody has started playing yet.
  loadUploadedFaces().then(n => { if (n && !S.running && !S.over && S.bank.length === 0) reset(); });
})();
</script>
