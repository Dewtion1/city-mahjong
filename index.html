<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12332a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>City Mahjong</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --baize-1: #27604a; --baize-2: #1c4a39; --baize-3: #12332a;
    --ivory: #efe5cf; --muted: #cbd6c8; --brass: #e3c67a; --brass-2: #b48f36; --ink: #2b2419; --ink-2: #5a4b34; --gold-ink: #8a6a2a; --red: #a8463c;
    --tile-1: #f9f2e2; --tile-2: #f0e4ca; --tile-3: #e7d8b9; --bevel: #cdb68c;
    --font-display: 'Baloo 2', 'Nunito', system-ui, sans-serif; --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--baize-3); color: var(--ivory); font-family: var(--font-body); display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box; overflow: hidden; }
  #stage { position: relative; width: min(100%, 460px); flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 390 / 844; touch-action: manipulation; user-select: none; -webkit-user-select: none; background: var(--baize-2); }

  /* Full-screen baize pages and overlays */
  .sheet { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; overflow-y: auto; box-sizing: border-box;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sheet[hidden] { display: none; }
  .sheet.page { background: radial-gradient(ellipse 80% 60% at 50% 30%, var(--baize-1) 0%, var(--baize-2) 50%, var(--baize-3) 100%); }
  .sheet.dim { background: rgba(8,24,18,.62); backdrop-filter: blur(3px); justify-content: center; }
  .sheet.page::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"); }
  .sheet.page::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 75% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%); }
  .sheet > * { position: relative; z-index: 1; }
  .col { width: min(100%, 358px); display: flex; flex-direction: column; }

  .eyebrow { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--brass); font-weight: 600; }
  .label { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1.title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; color: var(--ivory); letter-spacing: -.015em; }

  .btn { appearance: none; border: 0; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; font-family: var(--font-body); font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; box-sizing: border-box; text-decoration: none; }
  .btn.gold { background: linear-gradient(180deg, #e1c272, #b48f36); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 5px 0 #8a6a2a, 0 8px 12px rgba(0,0,0,.35); }
  .btn.gold:active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #8a6a2a, 0 4px 8px rgba(0,0,0,.3); }
  .btn.line { background: transparent; color: var(--ivory); box-shadow: inset 0 0 0 1.5px rgba(239,229,207,.55); }
  .btn.line.dark { color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(43,36,25,.4); }
  .btn:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .link { align-self: center; margin-top: 6px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--gold-ink); background: none; border: 0; padding: 10px 14px; cursor: pointer; font-family: inherit; }

  /* Ivory panel (results, leaderboard, add player) */
  .panel { position: relative; border-radius: 28px; background: linear-gradient(180deg, var(--tile-1) 0%, var(--tile-2) 60%, #e9dbbf 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 1px rgba(120,94,56,.3), inset 0 -8px 0 var(--bevel), 0 18px 30px rgba(0,0,0,.5); color: var(--ink); box-sizing: border-box; }
  .panel.framed::before { content: ""; position: absolute; inset: 10px 10px 16px; border-radius: 20px; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(180,143,54,.55); }

  /* Home: level grid */
  .levels { position: relative; height: 300px; overflow-y: auto; padding: 4px 2px 60px; box-sizing: border-box; -webkit-overflow-scrolling: touch; }
  .levels .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .lv { position: relative; height: 74px; border-radius: 11px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; padding: 0; font-family: var(--font-body); cursor: pointer; }
  .lv.done, .lv.cur { background: linear-gradient(180deg, var(--tile-1) 0%, var(--tile-2) 55%, var(--tile-3) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.8), inset 0 0 0 1px rgba(120,94,56,.3), inset 0 -5px 0 var(--bevel), 0 3px 4px rgba(0,0,0,.42); color: var(--ink); }
  .lv.cur { box-shadow: inset 0 1px 0 rgba(255,255,255,.8), inset 0 0 0 1px rgba(120,94,56,.3), inset 0 -5px 0 var(--bevel), 0 0 0 2px #d9b85c, 0 0 14px 3px rgba(217,184,92,.45), 0 6px 8px rgba(0,0,0,.5); }
  .lv.lock { background: linear-gradient(180deg, #1f5240, #15382c); box-shadow: inset 0 0 0 1px rgba(217,184,92,.4), inset 0 0 0 4px #1a4636, inset 0 0 0 5px rgba(217,184,92,.22), 0 2px 3px rgba(0,0,0,.35); color: rgba(227,198,122,.55); cursor: default; }
  .lv .num { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
  .lv .nm { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; line-height: 1; color: #6b5a3e; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv.cur .nm { color: var(--gold-ink); }
  .lv:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; pointer-events: none; background: linear-gradient(180deg, rgba(23,62,47,0) 0%, rgba(23,62,47,.92) 100%); }

  /* Home: players */
  .players { display: flex; align-items: center; gap: 12px; overflow-x: auto; padding: 6px 2px 10px; -webkit-overflow-scrolling: touch; }
  .players button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: none; width: 56px; font-family: var(--font-body); font-size: 10px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .players .av { width: 50px; height: 50px; border-radius: 50%; background: #8c7a5c center/cover no-repeat; box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12); display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; color: var(--tile-1); }
  .players button[aria-selected="true"] .av { box-shadow: 0 0 0 2.5px #d9b85c, 0 0 10px 2px rgba(217,184,92,.4), 0 2px 4px rgba(0,0,0,.45); }
  .players button[aria-selected="true"] { color: var(--ivory); }
  .players button span { max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players .add .av { background: transparent; box-shadow: none; border: 1.5px dashed rgba(217,184,92,.75); color: var(--brass); font-size: 26px; font-family: var(--font-body); font-weight: 300; }
  .players button:focus-visible .av { outline: 3px solid var(--brass); outline-offset: 2px; }

  /* Leaderboard */
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(180,143,54,.55); background: rgba(205,182,140,.25); }
  .tabs button { appearance: none; border: 0; background: transparent; flex: 1; height: 38px; border-radius: 999px; font-family: var(--font-body); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink-2); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: linear-gradient(180deg, #e1c272, #b48f36); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 2px 4px rgba(0,0,0,.2); }
  .lbhead { display: flex; justify-content: space-between; padding: 8px 12px 0; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; }
  .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 12px; border-radius: 14px; box-sizing: border-box; }
  .row.me { background: rgba(180,143,54,.22); box-shadow: inset 0 0 0 1px rgba(180,143,54,.55); }
  .rk { width: 22px; font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--gold-ink); font-variant-numeric: tabular-nums; text-align: right; flex: none; }
  .row .av { width: 32px; height: 32px; border-radius: 50%; flex: none; background: #8c7a5c center/cover no-repeat; box-shadow: 0 1px 2px rgba(0,0,0,.3); display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; color: var(--tile-1); }
  .nm { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.1; }
  .sub { font-size: 11.5px; color: var(--ink-2); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .sc { margin-left: auto; font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--ink-2); padding: 24px 0; font-weight: 600; }
  .back { width: 44px; height: 44px; margin-left: -8px; display: flex; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer; }
  .back svg { width: 24px; height: 24px; stroke: var(--ivory); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Add player bottom sheet */
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: linear-gradient(180deg, var(--tile-1) 0%, var(--tile-2) 70%, #e9dbbf 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 1px rgba(120,94,56,.3), 0 -14px 30px rgba(0,0,0,.45); padding: 12px 24px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; color: var(--ink); box-sizing: border-box; }
  .grip { width: 40px; height: 4px; border-radius: 2px; background: rgba(120,94,56,.35); align-self: center; }
  .bottom h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -.01em; }
  .photo { appearance: none; border: 0; width: 96px; height: 96px; border-radius: 50%; flex: none; cursor: pointer; background: rgba(205,182,140,.3) center/cover no-repeat; box-shadow: inset 0 0 0 2px rgba(180,143,54,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--gold-ink); font-family: var(--font-body); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
  .photo svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .photo.has { color: transparent; }
  .photo.has svg { display: none; }
  .field label { display: block; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--gold-ink); margin-bottom: 8px; }
  .field input { width: 100%; height: 50px; border: 0; border-radius: 14px; padding: 0 16px; font-family: var(--font-body); font-size: 17px; color: var(--ink); background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1.5px rgba(120,94,56,.35), inset 0 2px 3px rgba(0,0,0,.08); box-sizing: border-box; outline: none; }
  .field input:focus-visible { box-shadow: inset 0 0 0 2px var(--brass-2); }
  .hint { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
  .pill.gold { background: linear-gradient(180deg, #e1c272, #b48f36); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 2px 4px rgba(0,0,0,.25); }
  .pill.red { background: var(--red); color: var(--tile-1); font-family: var(--font-body); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; }
  .mini { width: 30px; height: 40px; border-radius: 6px; background: linear-gradient(180deg, var(--tile-1), var(--tile-3)); box-shadow: inset 0 1px 0 rgba(255,255,255,.8), inset 0 0 0 1px rgba(120,94,56,.3), inset 0 -3px 0 var(--bevel), 0 3px 5px rgba(0,0,0,.45); flex: none; }
  @media (prefers-reduced-motion: reduce) { .sheet.dim { backdrop-filter: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="390" height="844" aria-label="City Mahjong"></canvas></div>

<div class="sheet page" id="homeSheet">
  <div class="col" style="gap: 14px; min-height: 100%">
    <header style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 26px 0 4px">
      <span class="eyebrow">Daily tile puzzle</span>
      <h1 class="title">City Mahjong</h1>
      <span id="homeDay" style="font-size: 14px; color: var(--muted)"></span>
    </header>
    <div class="levels" id="levelsWrap"><div class="grid" id="levels" role="listbox" aria-label="Level"></div></div>
    <section style="display: flex; flex-direction: column; gap: 4px">
      <span class="label">Who's playing</span>
      <div class="players" id="players"></div>
    </section>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px">
      <button class="btn gold" type="button" id="homePlay">Play</button>
      <button class="btn line" type="button" id="homeBoard">Leaderboard</button>
    </div>
  </div>
</div>

<div class="sheet dim" id="nameSheet" hidden>
  <form class="bottom" id="nameForm">
    <div class="grip"></div>
    <h2 id="nameTitle">Add a player</h2>
    <div style="display: flex; align-items: center; gap: 18px">
      <button type="button" class="photo" id="photoBtn" aria-label="Choose a photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8 H7 L9 5 H15 L17 8 H20 V19 H4 Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span>Photo</span></button>
      <input type="file" id="photoInput" accept="image/*" style="position:absolute;left:-9999px">
      <p class="hint">A clear face photo, cropped square. It becomes this player's tile in every level, so pick one everyone will recognise at 40px.</p>
    </div>
    <div class="field"><label for="nameInput">Name</label><input id="nameInput" maxlength="20" autocomplete="nickname" placeholder="Shown on the leaderboard" required></div>
    <div style="display: flex; gap: 10px">
      <button class="btn line dark" type="button" id="nameCancel" style="flex: 1">Cancel</button>
      <button class="btn gold" type="submit" id="nameSave" style="flex: 1">Save</button>
    </div>
  </form>
</div>

<div class="sheet page" id="boardSheet" hidden>
  <div class="col" style="gap: 14px; min-height: 100%">
    <header style="display: flex; align-items: center; height: 44px; padding-top: 10px">
      <button class="back" type="button" id="boardClose" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></button>
      <h1 style="margin: 0 0 0 4px; font-family: var(--font-display); font-weight: 700; font-size: 28px; color: var(--ivory); letter-spacing: -.01em">Leaderboard</h1>
    </header>
    <section class="panel" style="flex: 1; padding: 12px 10px 20px; display: flex; flex-direction: column; gap: 10px">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-scope="total">Overall</button>
        <button type="button" role="tab" aria-selected="false" data-scope="today">Today</button>
        <button type="button" role="tab" aria-selected="false" data-scope="all">This level</button>
      </div>
      <div class="lbhead"><span>Player</span><span id="boardSub">Best on every level</span></div>
      <div id="boardBody"><div class="empty">Loading…</div></div>
    </section>
  </div>
</div>

<div class="sheet dim" id="winSheet" hidden>
  <div class="col" style="padding: 0 8px">
    <div id="winTiles" aria-hidden="true" style="display: flex; justify-content: center; gap: 10px; margin-bottom: -14px; position: relative; z-index: 2">
      <div class="mini" style="transform: rotate(-9deg) translateY(6px)"></div><div class="mini" style="transform: rotate(4deg) translateY(-4px)"></div><div class="mini" style="transform: rotate(12deg) translateY(8px)"></div>
    </div>
    <section class="panel framed" style="padding: 30px 24px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
      <span id="winEyebrow" class="eyebrow" style="color: var(--gold-ink); margin-top: 8px; font-weight: 700"></span>
      <span id="winTitle" style="font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums"></span>
      <span id="winLine" style="font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums"></span>
      <span id="winRank" class="pill gold" hidden></span>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 14px">
        <button class="btn gold" type="button" id="winNext">Next level</button>
        <div style="display: flex; gap: 10px">
          <button class="btn line dark" type="button" id="winAgain" style="flex: 1">Play again</button>
          <button class="btn line dark" type="button" id="winBoard" style="flex: 1">Leaderboard</button>
        </div>
        <button class="link" type="button" id="winHome">Home</button>
      </div>
    </section>
  </div>
</div>

<script src="faces.js"></script>
<script>
(function () {
  const SUPA_URL = 'https://zmxkxxlvaewwwqgrphlk.supabase.co', SUPA_KEY = 'sb_publishable_Opzos_yWd8FFPS1nATl5_Q_NZZay9fm';
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const W = 390, H = 844;
  const FD = "'Baloo 2', 'Nunito', system-ui, sans-serif", FB = "'Nunito', 'Segoe UI', system-ui, sans-serif";
  // Palette from the design: the old names are kept so the game logic's toast colours still resolve.
  const C = { ivory: '#efe5cf', muted: '#cbd6c8', brass: '#e3c67a', brass2: '#b48f36', ink: '#2b2419', red: '#a8463c', tile: '#f0e4ca', cash: '#e3c67a', sel: '#e3c67a', accent: '#d9705f', paper: '#efe5cf' };
  const SUIT = { bus: '#2b2419', cab: '#7a5a1a', park: '#2f5d3f' };
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

  // --- Tile kinds: three London suits of nine, plus seven family faces = 34 kinds. ---
  const KINDS = [];
  for (const suit of ['bus', 'cab', 'park']) for (let n = 1; n <= 9; n++) KINDS.push({ suit, n });
  const faceImgs = FACES.map(src => { const im = new Image(); im.src = src; return im; });
  const FACE_NAMES = ['', '', '', '', '', '', 'Iain'];
  faceImgs.forEach((im, i) => KINDS.push({ suit: 'face', n: i, who: FACE_NAMES[i] || 'Family ' + (i + 1) }));
  // Players (name + photo) live in city_mahjong_players; every player with a photo becomes a face tile.
  let PLAYERS = [];
  async function loadPlayers() {
    try {
      const res = await fetch(SUPA_URL + '/rest/v1/city_mahjong_players?select=id,name,photo,device_id,unlocked&order=name.asc', { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY } });
      if (!res.ok) return false;
      PLAYERS = (await res.json()).filter(p => p.name);
      const seen = new Set(FACES); const withPhoto = PLAYERS.filter(p => p.photo && /^data:image\//.test(p.photo) && !seen.has(p.photo) && (seen.add(p.photo), true));
      const loaded = await Promise.all(withPhoto.map(p => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = p.photo; })));
      faceImgs.length = FACES.length; KINDS.length = 27 + FACES.length;
      loaded.forEach((im, i) => { if (im && im.naturalWidth) { faceImgs.push(im); KINDS.push({ suit: 'face', n: faceImgs.length - 1, who: withPhoto[i].name }); } });
      return true;
    } catch (e) { return false; }
  }

    ctx.strokeStyle = 'rgba(217,184,92,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(16.5, TRAY_Y + 0.5, W - 33, TRAY_H - 1, 18); ctx.stroke();
    const top = ctx.createLinearGradient(0, TRAY_Y, 0, TRAY_Y + 8); top.addColorStop(0, 'rgba(0,0,0,.5)'); top.addColorStop(1, 'rgba(0,0,0,0)'); ctx.save(); ctx.beginPath(); ctx.roundRect(16, TRAY_Y, W - 32, TRAY_H, 18); ctx.clip(); ctx.fillStyle = top; ctx.fillRect(16, TRAY_Y, W - 32, 8); ctx.restore();
    for (let i = 0; i < BANK; i++) {
      const x = slotX(i), danger = i === BANK - 1;
      rr(x, SLOT_Y, SLOT_W, SLOT_H, 11, danger ? 'rgba(120,40,34,.28)' : 'rgba(0,0,0,.3)');
      const sg = ctx.createLinearGradient(0, SLOT_Y, 0, SLOT_Y + 6); sg.addColorStop(0, 'rgba(0,0,0,.55)'); sg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.save(); ctx.beginPath(); ctx.roundRect(x, SLOT_Y, SLOT_W, SLOT_H, 11); ctx.clip(); ctx.fillStyle = sg; ctx.fillRect(x, SLOT_Y, SLOT_W, 6); ctx.restore();
      if (danger) { ctx.strokeStyle = 'rgba(176,78,66,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x + 0.75, SLOT_Y + 0.75, SLOT_W - 1.5, SLOT_H - 1.5, 11); ctx.stroke(); }
      const t = S.bank[i]; if (t === undefined) continue;
      const hint = S.hint && S.hint.includes(t) && S.hintT > 0;
      drawTileAt(bankX(i), BANK_Y, BTW, KINDS[S.kinds[t]], { glow: hint });
    }
    ctx.restore();
  }
  function render() {
    drawTable();
    const order = [...S.alive].sort((a, b) => POS[a].z - POS[b].z || POS[a].y - POS[b].y || POS[a].x - POS[b].x);
    for (const i of order) drawTile(i);
    drawFx();
    drawHeader(); drawControls(); drawBank();
    if (S.toastT > 0) { ctx.save(); ctx.globalAlpha = Math.min(1, S.toastT * 3); ctx.textAlign = 'center'; ctx.font = `600 22px ${FD}`; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8; ctx.fillStyle = S.toast.color; ctx.fillText(S.toast.text, W / 2, OY_TOP + 24 - (0.9 - S.toastT) * 16); ctx.restore(); }
  }
  let last = performance.now();
  function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; if (S.running) S.t += dt; if (S.toastT > 0) S.toastT -= dt; if (S.hintT > 0) S.hintT -= dt; if (S.shake) S.shake.t -= dt; stepFx(dt); render(); requestAnimationFrame(frame); }
  reset(); requestAnimationFrame(frame); syncHome();
  loadPlayers().then(() => { const me = PLAYERS.find(p => p.id === playerId); if (me) { if ((me.unlocked || 1) < unlocked) saveProgress(); else choosePlayer(me); } if (!S.running && !S.over && S.bank.length === 0) reset(); syncHome(); });
})();
