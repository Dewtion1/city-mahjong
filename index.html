<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#146e3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>City Mahjong</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --baize-1: #1e9150; --baize-2: #146e3c; --baize-3: #0b4727;
    --ivory: #ffffff; --muted: #d6f0dc; --brass: #ffe27a; --brass-2: #f0b92a; --ink: #1c6a42; --ink-2: #5a4b34; --gold-ink: #a3640a; --red: #d02e2e; --yellow: #ffd93b;
    --tile-1: #fdf8ea; --tile-2: #f6ecd3; --tile-3: #efe1c1; --bevel: #d8c69f;
    --green-btn: radial-gradient(ellipse at 50% 20%, #8fe08f 0%, #3fae57 50%, #227f3f 100%);
    --green-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -6px 0 rgba(0,0,0,.22), 0 0 0 3px #f0cf5c, 0 0 0 5px #a9842a, 0 7px 10px rgba(0,0,0,.4);
    --panel-shadow: inset 0 3px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(140,110,60,.18), 0 10px 0 #d8c69f, 0 22px 30px rgba(0,0,0,.45);
    --font-display: 'Baloo 2', 'Nunito', system-ui, sans-serif; --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--baize-3); color: var(--ivory); font-family: var(--font-body); display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box; overflow: hidden; }
  #stage { position: relative; width: min(100%, 460px); flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 390 / 844; touch-action: manipulation; user-select: none; -webkit-user-select: none; background: #146e3c; }

  /* Full-screen baize pages and overlays */
  .sheet { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; overflow-y: auto; box-sizing: border-box;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sheet[hidden] { display: none; }
  .sheet.page { background: linear-gradient(180deg, #146e3c 0%, #1e9150 45%, #1a8447 100%); }
  .sheet.dim { background: rgba(5,40,22,.6); backdrop-filter: blur(3px); justify-content: center; }
  .sheet.page::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .035; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"); }
  .sheet.page::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 75% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.28) 100%); }
  .sheet > * { position: relative; z-index: 1; }
  .col { width: min(100%, 358px); display: flex; flex-direction: column; }

  .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--brass); font-weight: 800; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .label { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ivory); font-weight: 800; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  h1.title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; color: var(--yellow); letter-spacing: -.01em; text-shadow: 0 3px 0 #a3640a, 0 6px 8px rgba(0,0,0,.4); }

  .btn { appearance: none; border: 0; display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 999px; font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; box-sizing: border-box; text-decoration: none; }
  .btn.gold { background: var(--green-btn); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); box-shadow: var(--green-shadow); }
  .btn.gold:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.22), 0 0 0 3px #f0cf5c, 0 0 0 5px #a9842a, 0 3px 6px rgba(0,0,0,.35); }
  .btn.line { background: linear-gradient(180deg, #ffe27a, #f0b92a); color: #5a3d08; text-shadow: 0 1px 0 rgba(255,255,255,.4); box-shadow: inset 0 3px 0 rgba(255,255,255,.6), inset 0 -5px 0 rgba(0,0,0,.15), 0 0 0 3px #a9842a, 0 6px 10px rgba(0,0,0,.35); }
  .btn.line.dark { font-size: 16px; color: var(--ink); text-shadow: none; background: rgba(255,255,255,.45); box-shadow: inset 0 0 0 2.5px var(--ink), 0 3px 0 #d8c69f; }
  .btn:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .link.danger { color: var(--red); margin-top: -6px; }
  .players .av { width: 50px; height: 50px; border-radius: 50%; background: #8c7a5c center/cover no-repeat; box-shadow: 0 3px 0 rgba(0,0,0,.25), 0 4px 6px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.2); display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; color: var(--tile-1); position: relative; }
  .players .av .pen { position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #ffd93b; color: #5a3d08; display: grid; place-items: center; box-shadow: 0 0 0 2px #a9842a, 0 1px 2px rgba(0,0,0,.4); }
  .link { align-self: center; margin-top: 4px; font-family: var(--font-display); font-size: 16px; letter-spacing: .05em; text-transform: uppercase; font-weight: 800; color: var(--gold-ink); background: none; border: 0; padding: 10px 14px; cursor: pointer; }

  /* Ivory panel (results, leaderboard, add player) */
  .panel { position: relative; border-radius: 28px; background: linear-gradient(180deg, var(--tile-1) 0%, var(--tile-2) 60%, var(--tile-3) 100%); box-shadow: var(--panel-shadow); color: var(--ink); box-sizing: border-box; }
  .panel.framed::before { content: none; }

  /* Home: level grid */
  .levels { position: relative; height: 300px; overflow-y: auto; padding: 4px 2px 60px; box-sizing: border-box; -webkit-overflow-scrolling: touch; }
  .levels .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .lv { position: relative; height: 74px; border-radius: 11px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; padding: 0; font-family: var(--font-body); cursor: pointer; }
  .lv.done, .lv.cur { background: linear-gradient(180deg, var(--tile-1) 0%, var(--tile-2) 60%, var(--tile-3) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(140,110,60,.18), 0 5px 0 #d8c69f, 0 7px 6px rgba(0,0,0,.38); color: var(--ink); }
  .lv.cur { box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(140,110,60,.18), 0 5px 0 #d8c69f, 0 0 0 3px #ffd93b, 0 0 14px 4px rgba(255,217,59,.55), 0 8px 8px rgba(0,0,0,.45); }
  .lv.lock { background: linear-gradient(180deg, #115f36, #0b4727); box-shadow: inset 0 2px 4px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,226,122,.35), 0 4px 0 #083421, 0 6px 6px rgba(0,0,0,.3); color: rgba(255,226,122,.5); cursor: default; }
  .lv .num { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
  .lv .nm { font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; line-height: 1; color: #7a6a48; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv.cur .nm { color: var(--gold-ink); }
  .lv:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; pointer-events: none; background: linear-gradient(180deg, rgba(30,145,80,0) 0%, rgba(30,145,80,.95) 100%); }

  /* Home: players */
  .players { display: flex; align-items: center; gap: 12px; overflow-x: auto; padding: 6px 2px 10px; -webkit-overflow-scrolling: touch; }
  .players button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: none; width: 56px; font-family: var(--font-body); font-size: 10px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .players .av { width: 50px; height: 50px; border-radius: 50%; background: #8c7a5c center/cover no-repeat; box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12); display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; color: var(--tile-1); }
  .players button[aria-selected="true"] .av { box-shadow: 0 0 0 3px #ffd93b, 0 0 0 5px #a9842a, 0 0 12px 3px rgba(255,217,59,.5), 0 4px 6px rgba(0,0,0,.35); }
  .players button[aria-selected="true"] { color: var(--ivory); }
  .players button span { max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players .add .av { background: transparent; box-shadow: none; border: 2px dashed rgba(255,226,122,.85); color: var(--brass); font-size: 26px; font-family: var(--font-body); font-weight: 400; }
  .players button:focus-visible .av { outline: 3px solid var(--brass); outline-offset: 2px; }

  /* Leaderboard */
  .tabs { display: flex; gap: 6px; padding: 5px; border-radius: 999px; box-shadow: inset 0 2px 4px rgba(0,0,0,.15); background: rgba(216,198,159,.45); }
  .tabs button { appearance: none; border: 0; background: transparent; flex: 1; height: 40px; border-radius: 999px; font-family: var(--font-display); font-size: 15px; letter-spacing: .02em; font-weight: 800; color: var(--ink-2); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--green-btn); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.2), 0 0 0 2px #f0cf5c, 0 0 0 3.5px #a9842a; }
  .lbhead { display: flex; justify-content: space-between; padding: 6px 12px 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-ink); font-weight: 800; }
  .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 12px; border-radius: 999px; box-sizing: border-box; }
  .row.me { background: rgba(255,217,59,.35); box-shadow: inset 0 0 0 2px #e4b23a; }
  .rk { width: 22px; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--gold-ink); font-variant-numeric: tabular-nums; text-align: right; flex: none; }
  .row .av { width: 32px; height: 32px; border-radius: 50%; flex: none; background: #8c7a5c center/cover no-repeat; box-shadow: 0 1px 2px rgba(0,0,0,.3); display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; color: var(--tile-1); }
  .nm { font-size: 15px; font-weight: 800; color: var(--ink); line-height: 1.1; }
  .sub { font-size: 11.5px; color: var(--ink-2); line-height: 1.1; font-variant-numeric: tabular-nums; font-weight: 700; }
  .sc { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--ink-2); padding: 24px 0; font-weight: 600; }
  .back { width: 54px; height: 54px; margin-right: 4px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; cursor: pointer; background: radial-gradient(circle at 50% 28%, #8fe08f 0%, #3fae57 45%, #227f3f 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -5px 0 rgba(0,0,0,.22), 0 0 0 2.5px #f0cf5c, 0 0 0 4px #a9842a, 0 5px 8px rgba(0,0,0,.4); flex: none; }
  .back svg { width: 26px; height: 26px; stroke: #f8f0d8; fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }

  /* Add player bottom sheet */
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, var(--tile-1) 0%, var(--tile-2) 70%, var(--tile-3) 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(140,110,60,.18), 0 -14px 30px rgba(0,0,0,.45); padding: 12px 24px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; color: var(--ink); box-sizing: border-box; }
  .grip { width: 44px; height: 5px; border-radius: 3px; background: rgba(140,110,60,.35); align-self: center; }
  .bottom h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: -.01em; color: var(--ink); }
  .photo { appearance: none; border: 0; width: 96px; height: 96px; border-radius: 50%; flex: none; cursor: pointer; background: rgba(216,198,159,.4) center/cover no-repeat; box-shadow: inset 0 0 0 3px #e4b23a, inset 0 3px 6px rgba(0,0,0,.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--gold-ink); font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }
  .photo svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .photo.has { color: transparent; }
  .photo.has svg { display: none; }
  .field label { display: block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 800; color: var(--gold-ink); margin-bottom: 8px; }
  .field input { width: 100%; height: 52px; border: 0; border-radius: 999px; padding: 0 20px; font-family: var(--font-body); font-size: 17px; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 2px rgba(140,110,60,.3), inset 0 3px 4px rgba(0,0,0,.1); box-sizing: border-box; outline: none; }
  .field input:focus-visible { box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 3px 4px rgba(0,0,0,.1); }
  .hint { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); font-weight: 700; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px 9px 14px; border-radius: 999px; font-family: var(--font-display); font-weight: 800; font-size: 17px; }
  .pill.gold { background: linear-gradient(180deg, #ffe27a, #f0b92a); color: #5a3d08; box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 0 0 2.5px #a9842a, 0 3px 5px rgba(0,0,0,.25); }
  .pill.red { background: linear-gradient(180deg, #f06060, #d02e2e); color: #fff; padding: 9px 20px; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 1px 0 rgba(0,0,0,.3); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 0 0 2.5px #fff5d6, 0 3px 5px rgba(0,0,0,.3); }
  .mini { width: 34px; height: 44px; border-radius: 5px; background: linear-gradient(180deg, var(--tile-1), var(--tile-3)); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(140,110,60,.18), 0 4px 0 #d8c69f, 0 6px 6px rgba(0,0,0,.4); flex: none; }
  @media (prefers-reduced-motion: reduce) { .sheet.dim { backdrop-filter: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="390" height="844" aria-label="City Mahjong"></canvas></div>

<div class="sheet page" id="homeSheet">
  <div class="col" style="gap: 14px; min-height: 100%">
    <header style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 26px 0 4px">
      <span class="eyebrow">Daily tile puzzle</span>
      <h1 class="title">City Mahjong</h1>
      <span id="homeDay" style="font-size: 14px; color: var(--muted)"></span>
    </header>
    <div class="levels" id="levelsWrap"><div class="grid" id="levels" role="listbox" aria-label="Level"></div></div>
    <section style="display: flex; flex-direction: column; gap: 4px">
      <span class="label">Who's playing</span>
      <div class="players" id="players"></div>
    </section>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px">
      <button class="btn gold" type="button" id="homePlay">Play</button>
      <button class="btn line" type="button" id="homeBoard">Leaderboard</button>
    </div>
  </div>
</div>

<div class="sheet dim" id="nameSheet" hidden>
  <form class="bottom" id="nameForm">
    <div class="grip"></div>
    <h2 id="nameTitle">Add a player</h2>
    <div style="display: flex; align-items: center; gap: 18px">
      <button type="button" class="photo" id="photoBtn" aria-label="Choose a photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8 H7 L9 5 H15 L17 8 H20 V19 H4 Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span>Photo</span></button>
      <input type="file" id="photoInput" accept="image/*" style="position:absolute;left:-9999px">
      <p class="hint">A clear face photo, cropped square. It becomes this player's tile in every level, so pick one everyone will recognise at 40px.</p>
    </div>
    <div class="field"><label for="nameInput">Name</label><input id="nameInput" maxlength="20" autocomplete="nickname" placeholder="Shown on the leaderboard" required></div>
    <div style="display: flex; gap: 10px">
      <button class="btn line dark" type="button" id="nameCancel" style="flex: 1">Cancel</button>
      <button class="btn gold" type="submit" id="nameSave" style="flex: 1">Save</button>
    </div>
    <button type="button" class="link danger" id="nameDelete" hidden>Delete player</button>
  </form>
</div>

<div class="sheet page" id="boardSheet" hidden>
  <div class="col" style="gap: 14px; min-height: 100%">
    <header style="display: flex; align-items: center; height: 54px; padding-top: 14px; gap: 8px">
      <button class="back" type="button" id="boardClose" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 L7.5 12 L14.5 19"></path></svg></button>
      <h1 style="margin: 0 0 0 6px; font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--yellow); letter-spacing: -.01em; text-shadow: 0 3px 0 #a3640a, 0 5px 8px rgba(0,0,0,.35)">Leaderboard</h1>
    </header>
    <section class="panel" style="flex: 1; padding: 12px 10px 20px; display: flex; flex-direction: column; gap: 10px">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-scope="total">Overall</button>
        <button type="button" role="tab" aria-selected="false" data-scope="today">Today</button>
        <button type="button" role="tab" aria-selected="false" data-scope="all">This level</button>
      </div>
      <div class="lbhead"><span>Player</span><span id="boardSub">Best on every level</span></div>
      <div id="boardBody"><div class="empty">Loading…</div></div>
    </section>
  </div>
</div>

<div class="sheet dim" id="winSheet" hidden>
  <div class="col" style="padding: 0 8px">
    <div id="winTiles" aria-hidden="true" style="display: flex; justify-content: center; gap: 10px; margin-bottom: -14px; position: relative; z-index: 2">
      <div class="mini" style="transform: rotate(-9deg) translateY(6px)"></div><div class="mini" style="transform: rotate(4deg) translateY(-4px)"></div><div class="mini" style="transform: rotate(12deg) translateY(8px)"></div>
    </div>
    <section class="panel" style="padding: 30px 24px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
      <span id="winEyebrow" style="font-family: var(--font-display); font-size: 18px; letter-spacing: .02em; color: var(--gold-ink); font-weight: 800; margin-top: 4px"></span>
      <span id="winTitle" style="font-family: var(--font-display); font-weight: 800; font-size: 78px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--yellow); text-shadow: 0 4px 0 #a3640a, 0 7px 10px rgba(0,0,0,.25)"></span>
      <span id="winLine" style="font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 700"></span>
      <span id="winRank" class="pill gold" hidden></span>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 18px">
        <button class="btn gold" type="button" id="winNext">Next level</button>
        <div style="display: flex; gap: 12px">
          <button class="btn line dark" type="button" id="winAgain" style="flex: 1">Play again</button>
          <button class="btn line dark" type="button" id="winBoard" style="flex: 1">Leaderboard</button>
        </div>
        <button class="link" type="button" id="winHome">Home</button>
      </div>
    </section>
  </div>
</div>

<script src="faces.js"></script>
<script>
(function () {

  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const W = 390, H = 844;
